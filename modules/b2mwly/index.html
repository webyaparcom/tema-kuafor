  .modulex-sayac-dolgu :where(h2, h3, h4, p, ul, ol, li, figure, blockquote, dl, dd) { margin: 0; }

  .modulex-sayac-dolgu-su { position: absolute; inset-inline: 0; inset-block-end: 0; z-index: -1; height: calc(var(--oran) * 100%); background: color-mix(in srgb, --accent-- 22%, --kartBg--); transition: height 1.6s cubic-bezier(0.2, 0.8, 0.2, 1); }
  .modulex-sayac-dolgu-su::before { content: ""; position: absolute; inset-inline: -10%; inset-block-start: -10px; height: 20px; border-radius: 50%; background: inherit; animation: modulex-sayac-dolgu-dalga 4s ease-in-out infinite alternate; }
  .modulex-sayac-dolgu--hazir:not(.modulex-sayac-dolgu--gor) .modulex-sayac-dolgu-su { height: 0; }

  :is([lang="ar"], [lang="fa"], [lang="he"], [lang="ur"]) .modulex-sayac-dolgu :is(.modulex-sayac-dolgu-baslik, .modulex-sayac-dolgu-ust, h3, h4, strong) { letter-spacing: 0; }
  :is([lang="ar"], [lang="fa"], [lang="he"], [lang="ur"]) .modulex-sayac-dolgu-baslik { line-height: 1.35; }

  @media (prefers-reduced-motion: reduce) {

</style>
<script>
  (() => {
    const P = "modulex-sayac-dolgu";
    const az = !!(window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches);
    const gozlem = (s, P, az) => {
        const gor = () => s.classList.add(P + "--gor");
        s.classList.add(P + "--hazir");
        if (az || !("IntersectionObserver" in window)) { gor(); return; }
        const io = new IntersectionObserver((gs) => {
          gs.forEach((g) => { if (g.isIntersecting) { gor(); io.disconnect(); } });
        }, { threshold: 0.15 });
        io.observe(s);
      };
    const sayac = (s, P, az) => {
        const el = [...s.querySelectorAll("[data-hedef]")];
        if (!el.length || az || !("IntersectionObserver" in window)) return;
        const dl = document.documentElement.lang || undefined;
        const oynat = () => el.forEach((e) => {
          const h = Number(e.dataset.hedef);
          const od = Number(e.dataset.ondalik) || 0;
          const son = e.textContent;
          if (!Number.isFinite(h)) return;
          let f;
          try { f = new Intl.NumberFormat(dl, { minimumFractionDigits: od, maximumFractionDigits: od }); } catch (x) { return; }
          const t0 = performance.now();
          const adim = (t) => {
            const p = Math.min(1, (t - t0) / 1300);
            e.textContent = p < 1 ? f.format(h * (1 - Math.pow(1 - p, 3))) : son;
            if (p < 1) requestAnimationFrame(adim);
          };
          requestAnimationFrame(adim);
        });
        const io = new IntersectionObserver((gs) => {
          gs.forEach((g) => { if (g.isIntersecting) { oynat(); io.disconnect(); } });
        }, { threshold: 0.3 });
        io.observe(s);
      };
    document.querySelectorAll("." + P).forEach((s) => {
      if (s.dataset.fbHazir) return;
      s.dataset.fbHazir = "1";
      gozlem(s, P, az);
      sayac(s, P, az);
    });
  })();
</script>
