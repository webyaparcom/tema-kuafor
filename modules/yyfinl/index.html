<section class="modulex-iletisim-asimetrik{{fbsinif}}" {{fbetiket}}>
  <div class="modulex-iletisim-asimetrik-ic">
    {{fbbas}}
    {{fbgovde}}
  </div>
</section>

<style>
  /* iletisim-asimetrik — Düz ızgara yerine ritimli, dergi sayfası gibi kaydırılmış kartlar; yaratıcı ve modern markalar için. */
  .modulex-iletisim-asimetrik { box-sizing: border-box; width: 100%; padding: --bosluk-- 20px; background: --bg--; color: --text--; font-size: 1rem; line-height: 1.6; font-family: var(--mx-font-sans, inherit); overflow-wrap: break-word; }
  .modulex-iletisim-asimetrik *, .modulex-iletisim-asimetrik *::before, .modulex-iletisim-asimetrik *::after { box-sizing: border-box; }
  /* ham/css.css «* { font-size: 14px }» kalıtımı keser — modül içinde boyut üstten gelsin (ikon yazı tipi hariç) */
  .modulex-iletisim-asimetrik :where(*:not(.material-symbols-outlined)) { font-size: inherit; }
  /* aynı «*» kuralı font-weight 400 · line-height 1.2 · font-family de basar — modül içinde kalıtım */
  .modulex-iletisim-asimetrik :where(*:not(.material-symbols-outlined)) { font-weight: inherit; line-height: inherit; font-family: inherit; }
  .modulex-iletisim-asimetrik :where(h2, h3, h4, p, ul, ol, li, figure, blockquote, dl, dd) { margin: 0; }
  .modulex-iletisim-asimetrik :where(ul, ol) { padding: 0; list-style: none; }
  .modulex-iletisim-asimetrik img { display: block; max-width: 100%; }
  /* <img width height> öznitelik yüksekliği CSS aspect-ratio'yu ezer — sıfır özgüllükle auto (modül sınıfının height'ı yine kazanır) */
  :where(.modulex-iletisim-asimetrik) img { height: auto; }
  .modulex-iletisim-asimetrik [hidden] { display: none !important; }
  .modulex-iletisim-asimetrik :where(a, button, summary, [data-cevir]) { cursor: pointer; }
  .modulex-iletisim-asimetrik :where(a, button, summary, [tabindex]):focus-visible { outline: 3px solid --accent--; outline-offset: 3px; }
  .modulex-iletisim-asimetrik-ic { max-width: --max--; margin-inline: auto; }
  .modulex-iletisim-asimetrik-bas { display: grid; gap: 12px; margin-block-end: clamp(32px, 4vw, 52px); }
  .modulex-iletisim-asimetrik--bassiz .modulex-iletisim-asimetrik-bas { display: none; }
  .modulex-iletisim-asimetrik-ust { color: --accentInk--; font-size: 0.8rem; font-weight: 700; letter-spacing: 0.14em; text-transform: uppercase; }
  .modulex-iletisim-asimetrik-baslik { font-family: var(--mx-font-heading, inherit); font-size: clamp(1.8rem, 3.4vw, 2.8rem); font-weight: 750; letter-spacing: -0.025em; line-height: 1.1; }
  .modulex-iletisim-asimetrik-metin { color: --muted--; font-size: 1.05rem; line-height: 1.7; }
  .modulex-iletisim-asimetrik-cta { display: flex; flex-wrap: wrap; gap: 12px; margin-block-start: 8px; }
  .modulex-iletisim-asimetrik-dugme { display: inline-flex; align-items: center; gap: 8px; min-height: 48px; padding: 12px 22px; border: 2px solid --accent--; border-radius: 999px; background: --accent--; color: --accentText--; font-weight: 700; text-decoration: none; transition: transform 0.25s ease, background 0.25s ease, color 0.25s ease; }
  .modulex-iletisim-asimetrik-dugme:hover { transform: translateY(-2px); }
  .modulex-iletisim-asimetrik-dugme--ikincil { background: transparent; color: --text--; border-color: --cizgi--; }
  .modulex-iletisim-asimetrik-dugme--ikincil:hover { border-color: --accent--; }
  .modulex-iletisim-asimetrik-dugme .material-symbols-outlined { font-size: 20px; }

  .modulex-iletisim-asimetrik-duzen { display: grid; grid-template-columns: minmax(0, 1.15fr) minmax(0, 2fr); gap: clamp(28px, 4vw, 56px); align-items: start; }
  .modulex-iletisim-asimetrik-bas2 { display: grid; gap: 16px; position: sticky; inset-block-start: 96px; }
  .modulex-iletisim-asimetrik-kartlar { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 20px; padding-block-end: 56px; }
  .modulex-iletisim-asimetrik-kart { position: relative; display: grid; align-content: start; gap: 10px; padding: 28px 24px; border-radius: --yuvarlak--; background: --kartBg--; box-shadow: 0 18px 40px -26px color-mix(in srgb, --text-- 40%, transparent); transition: transform 0.4s ease, opacity 0.5s ease; }
  .modulex-iletisim-asimetrik-kart:nth-child(even) { transform: translateY(56px); }
  .modulex-iletisim-asimetrik-no { position: absolute; inset-block-start: 18px; inset-inline-end: 20px; color: --accentInk--; font-size: 0.9rem; font-weight: 800; letter-spacing: 0.1em; }
  .modulex-iletisim-asimetrik-kart .modulex-iletisim-asimetrik-kikon { margin-block-end: 6px; }
  .modulex-iletisim-asimetrik--hazir:not(.modulex-iletisim-asimetrik--gor) .modulex-iletisim-asimetrik-kart { opacity: 0; }
  .modulex-iletisim-asimetrik--gor .modulex-iletisim-asimetrik-kart { transition-delay: calc(var(--i, 0) * 80ms); }
  @media (max-width: 1024px) {
    .modulex-iletisim-asimetrik-duzen { grid-template-columns: minmax(0, 1fr); }
    .modulex-iletisim-asimetrik-bas2 { position: static; }
  }
  @media (max-width: 768px) {
    .modulex-iletisim-asimetrik-kartlar { grid-template-columns: minmax(0, 1fr); padding-block-end: 0; }
    .modulex-iletisim-asimetrik-kart:nth-child(even) { transform: none; }
  }
  .modulex-iletisim-asimetrik-kikon { flex: none; display: inline-grid; place-items: center; width: 48px; height: 48px; border-radius: 14px; background: color-mix(in srgb, --accent-- 14%, transparent); color: --accentInk--; font-size: 24px; }
  .modulex-iletisim-asimetrik-ketiket { display: block; color: --muted--; font-size: 0.82rem; font-weight: 650; letter-spacing: 0.06em; text-transform: uppercase; }
  .modulex-iletisim-asimetrik-deger { color: inherit; font-weight: 650; text-decoration: none; overflow-wrap: anywhere; transition: color 0.2s ease; }
  a.modulex-iletisim-asimetrik-deger:hover { color: --accentInk--; text-decoration: underline; text-underline-offset: 4px; }
  .modulex-iletisim-asimetrik-eylem { display: inline-flex; align-items: center; gap: 6px; color: --accentInk--; font-weight: 700; text-decoration: none; transition: gap 0.2s ease; }
  .modulex-iletisim-asimetrik-eylem:hover { gap: 10px; }
  .modulex-iletisim-asimetrik-eylem .material-symbols-outlined { font-size: 18px; }
  .modulex-iletisim-asimetrik-kopya { display: none; align-items: center; gap: 6px; min-height: 36px; padding: 6px 12px; border: 1px solid --cizgi--; border-radius: 999px; background: transparent; color: --text--; font: inherit; font-size: 0.85rem; font-weight: 650; transition: border-color 0.2s ease, background 0.2s ease; }
  .modulex-iletisim-asimetrik--kjs .modulex-iletisim-asimetrik-kopya { display: inline-flex; }
  .modulex-iletisim-asimetrik-kopya:hover { border-color: --accent--; }
  .modulex-iletisim-asimetrik-kopya .material-symbols-outlined { font-size: 18px; }
  .modulex-iletisim-asimetrik--kopyalandi { background: color-mix(in srgb, --accent-- 14%, transparent); }
  .modulex-iletisim-asimetrik-sosyal { display: grid; gap: 10px; }
  .modulex-iletisim-asimetrik-sbaslik { color: --muted--; font-size: 0.9rem; font-weight: 650; }
  .modulex-iletisim-asimetrik-sliste { display: flex; flex-wrap: wrap; gap: 8px; }
  .modulex-iletisim-asimetrik-cip { display: inline-flex; align-items: center; gap: 6px; min-height: 40px; padding: 8px 14px; border: 1px solid --cizgi--; border-radius: 999px; color: inherit; font-weight: 650; text-decoration: none; transition: border-color 0.2s ease, transform 0.2s ease; }
  .modulex-iletisim-asimetrik-cip:hover { border-color: --accent--; transform: translateY(-2px); }
  .modulex-iletisim-asimetrik-cikon { font-size: 18px; }
  .modulex-iletisim-asimetrik-harita { position: relative; overflow: hidden; min-height: 280px; border-radius: --yuvarlak--; background: --kartBg--; }
  .modulex-iletisim-asimetrik-iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; }
  .modulex-iletisim-asimetrik-hdesen { position: absolute; inset: 0; display: grid; place-items: center; background-color: color-mix(in srgb, --accent-- 8%, --kartBg--); background-image: linear-gradient(color-mix(in srgb, --text-- 7%, transparent) 1px, transparent 1px), linear-gradient(90deg, color-mix(in srgb, --text-- 7%, transparent) 1px, transparent 1px), radial-gradient(circle at 30% 40%, color-mix(in srgb, --accent-- 18%, transparent) 0 18%, transparent 19%); background-size: 36px 36px, 36px 36px, 100% 100%; }
  .modulex-iletisim-asimetrik-pin { color: --accentInk--; font-size: 56px; animation: modulex-iletisim-asimetrik-zipla 2.4s ease-in-out infinite; }
  @keyframes modulex-iletisim-asimetrik-zipla { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-10px); } }
  .modulex-iletisim-asimetrik-hyol { position: absolute; inset-block-end: 16px; inset-inline-start: 16px; display: inline-flex; align-items: center; gap: 8px; min-height: 44px; padding: 10px 16px; border-radius: 999px; background: --bg--; color: --text--; font-weight: 700; text-decoration: none; box-shadow: 0 6px 20px color-mix(in srgb, --text-- 16%, transparent); transition: transform 0.2s ease; }
  .modulex-iletisim-asimetrik-hyol:hover { transform: translateY(-2px); }
  .modulex-iletisim-asimetrik-hyol .material-symbols-outlined { font-size: 18px; color: --accentInk--; }

  :is([lang="ar"], [lang="fa"], [lang="he"], [lang="ur"]) .modulex-iletisim-asimetrik :is(.modulex-iletisim-asimetrik-baslik, .modulex-iletisim-asimetrik-ust, h3, h4, strong) { letter-spacing: 0; }
  :is([lang="ar"], [lang="fa"], [lang="he"], [lang="ur"]) .modulex-iletisim-asimetrik-baslik { line-height: 1.35; }
  @media (max-width: 768px) {
    .modulex-iletisim-asimetrik { padding-inline: 16px; }
  }
  @media (prefers-reduced-motion: reduce) {
    .modulex-iletisim-asimetrik *, .modulex-iletisim-asimetrik *::before, .modulex-iletisim-asimetrik *::after { animation: none !important; transition: none !important; }
  }
</style>
<script>
  (() => {
    const P = "modulex-iletisim-asimetrik";
    const az = !!(window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches);
    const gozlem = (s, P, az) => {
        const gor = () => s.classList.add(P + "--gor");
        s.classList.add(P + "--hazir");
        if (az || !("IntersectionObserver" in window)) { gor(); return; }
        const io = new IntersectionObserver((gs) => {
          gs.forEach((g) => { if (g.isIntersecting) { gor(); io.disconnect(); } });
        }, { threshold: 0.15 });
        io.observe(s);
      };
    document.querySelectorAll("." + P).forEach((s) => {
      if (s.dataset.fbHazir) return;
      s.dataset.fbHazir = "1";
      gozlem(s, P, az);
    });
  })();
</script>
